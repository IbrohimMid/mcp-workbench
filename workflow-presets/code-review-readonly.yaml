name: code-review-readonly
description: Read-only scan preset for review and inspection flows.
permissions:
  filesystem:
    read: true
    write: false
  shell:
    enabled: false
  network:
    enabled: false
steps:
  - tool: grep
    description: Find TODO and FIXME markers.
    arguments:
      pattern: TODO|FIXME
      glob: "*.md"
      ignoreCase: true
      literal: false
      maxResults: 50
  - tool: read
    description: Inspect the main README.
    arguments:
      path: README.md
