name: Bug report
description: Report a reproducible problem in mcp-workbench
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: The dashboard showed the wrong worker URL.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps you used.
      placeholder: |
        1. Open dashboard
        2. Create worker
        3. Start tunnel
        4. Copy URL
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The dashboard should show the public connector URL automatically.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: 322ca01 or main
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant output or attach screenshots.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran `make verify`
        - label: I did not include secrets or tokens
          required: true
