name: docker
description: Docker build and runtime signal distiller.
match:
  command:
    - "(^|\\s)docker\\s+(build|compose|run|logs)(\\s|$)"
rules:
  keep:
    - "error"
    - "failed"
  warn:
    - "^warning:"
  drop:
    - "^#\\d+ "
    - "^ => "
    - "^Sending build context to Docker daemon"
    - "^Step [0-9]+/"
  highlight:
    - "Successfully built"
    - "Successfully tagged"
