name: generic
description: General noise filter for command output.
rules:
  drop:
    - "^Compiling "
    - "^Finished "
    - "^Downloading "
    - "^Updating "
    - "^Checking "
    - "^Running "
  warn:
    - "^warning:"
    - "\\bdeprecated\\b"
  highlight:
    - "\\berror\\b"
    - "\\bfailed\\b"
    - "\\bpassed\\b"
    - "\\bcompleted\\b"
