name: tsc
description: TypeScript compiler signal distiller.
match:
  command:
    - "(^|\\s)tsc(\\s|$)"
rules:
  keep:
    - "error TS[0-9]+"
    - "Found [0-9]+ errors?"
  warn:
    - "^warning TS[0-9]+"
  drop:
    - "^Files: "
    - "^Lines: "
    - "^Nodes: "
    - "^Time: "
  highlight:
    - "Compiled successfully"
