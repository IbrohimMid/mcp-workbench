name: dual-chatgpt-notion
description: Two YOLO workers for ChatGPT and Notion on the same workspace.
defaults:
  workspace: ~/Documents/project
  permission: yolo
  tunnelMode: quick
  workflowMode: sync
workers:
  - name: chatgpt
    client: chatgpt
    port: 3333
  - name: notion
    client: notion
    port: 3334
